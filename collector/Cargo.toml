[package]
name    = "collector"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow     = "1.0"
chrono     = { version = "0.4", features = ["serde"] }
feed-rs    = "2.4"
reqwest    = { version = "0.13", default-features = false, features = ["json", "gzip", "http2", "charset", "rustls", "webpki-roots"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2       = "0.11"
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
toml       = "1.1"
url        = "2.5"

[profile.release]
opt-level = 1
debug     = false
