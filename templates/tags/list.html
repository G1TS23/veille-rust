{% extends "base.html" %}
{% block title %}Thèmes — {{ config.title }}{% endblock %}
{% block content %}
  <h2>Thèmes</h2>
  <ul class="tags">
    {% for term in terms %}
      <li><a href="{{ term.permalink }}">{{ term.name }} ({{ term.pages | length }})</a></li>
    {% endfor %}
  </ul>
{% endblock %}
